[project]
name = "nosql-lab"
version = "0.1.0"
description = "NoSQL work for DS2022"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymongo>=4.18.3",
]

[project.scripts]
nosql-lab = "nosql_lab:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
